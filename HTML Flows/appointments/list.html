<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simplify – Appointments</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <!-- Header -->
  <header class="header" role="banner">
    <div class="header-inner container">
      <a class="brand" href="../index.html"><span aria-hidden="true">🩺</span><span>Simplify</span></a>
      <button class="nav-toggle" data-nav-toggle aria-controls="primary-nav" aria-expanded="false">Menu</button>
      <nav class="nav" id="primary-nav" data-nav aria-label="Primary">
        <a href="../index.html">Dashboard</a>
        <a href="list.html" aria-current="page">Appointments</a>
        <a href="../messages/inbox.html">Messages</a>
        <a href="../ai-triage/index.html">AI Triage</a>
        <a href="../email/inbox.html">Email</a>
        <a href="../calendar/month.html">Calendar</a>
        <a href="../new-appointment/index.html">New Appointment</a>
        <a href="../notifications/index.html">Notifications</a>
      </nav>
    </div>
  </header>

  <main class="main container" role="main">
    <!-- Toolbar -->
    <section class="card" aria-label="Filters and actions">
      <div class="card-body">
        <div class="form-row">
          <div>
            <label for="filter-date">Date</label>
            <input class="input" id="filter-date" type="date" />
          </div>
          <div>
            <label for="filter-dept">Department</label>
            <select id="filter-dept">
              <option value="">All</option>
              <option>Cardiology</option>
              <option>Pediatrics</option>
              <option>Orthopedics</option>
            </select>
          </div>
        </div>
      </div>
      <div class="card-footer">
        <a class="button" href="../new-appointment/index.html">Create Appointment</a>
      </div>
    </section>

    <!-- List -->
    <section class="card" aria-labelledby="appt-list-h">
      <div class="card-header" id="appt-list-h">Appointments</div>
      <div class="card-body">
        <table class="table" role="table" aria-label="Appointments table">
          <thead><tr><th>ID</th><th>Patient</th><th>Doctor</th><th>Time</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody>
            <tr>
              <td>AP-1001</td><td>John Carter</td><td>Dr. Patel</td><td>09:30</td><td><span class="badge success">Confirmed</span></td>
              <td>
                <a class="button ghost" href="details.html">Details</a>
                <a class="button secondary" href="manage.html">Manage</a>
              </td>
            </tr>
            <tr>
              <td>AP-1002</td><td>Mary Green</td><td>Dr. Lee</td><td>10:15</td><td><span class="badge">Scheduled</span></td>
              <td>
                <a class="button ghost" href="details.html">Details</a>
                <a class="button secondary" href="manage.html">Manage</a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
  <footer class="footer">© 2025 Simplify Healthcare</footer>
  <script src="../js/main.js"></script>
</body>
</html>
