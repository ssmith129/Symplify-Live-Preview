<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simplify – Compose Email</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
<header class="header" role="banner">
  <div class="header-inner container">
    <a class="brand" href="../index.html"><span aria-hidden="true">🩺</span><span>Simplify</span></a>
    <button class="nav-toggle" data-nav-toggle aria-controls="primary-nav" aria-expanded="false">Menu</button>
    <nav class="nav" id="primary-nav" data-nav aria-label="Primary">
      <a href="../index.html">Dashboard</a>
      <a href="../appointments/list.html">Appointments</a>
      <a href="../messages/inbox.html">Messages</a>
      <a href="../ai-triage/index.html">AI Triage</a>
      <a href="inbox.html">Email</a>
      <a href="../calendar/month.html">Calendar</a>
      <a href="../new-appointment/index.html">New Appointment</a>
      <a href="../notifications/index.html">Notifications</a>
    </nav>
  </div>
</header>
<main class="main container" role="main">
  <h1>Compose</h1>
  <form id="email-compose-form" class="card" aria-labelledby="compose-h">
    <div class="card-header" id="compose-h">New Message</div>
    <div class="card-body">
      <div class="error-summary" aria-live="polite"></div>
      <div class="form-row">
        <div>
          <label for="emailTo">To</label>
          <input id="emailTo" class="input" type="email" placeholder="patient@example.com" required />
          <div class="error-text" data-error-for="emailTo" aria-live="polite"></div>
        </div>
        <div>
          <label for="emailSubject">Subject</label>
          <input id="emailSubject" class="input" type="text" placeholder="Subject" required />
          <div class="error-text" data-error-for="emailSubject" aria-live="polite"></div>
        </div>
      </div>
      <div>
        <label for="emailBody">Message</label>
        <textarea id="emailBody" rows="6" placeholder="Write your message..." required></textarea>
        <div class="error-text" data-error-for="emailBody" aria-live="polite"></div>
      </div>
    </div>
    <div class="card-footer form-actions">
      <a class="button secondary" href="inbox.html">Discard</a>
      <button class="button" type="submit">Send</button>
    </div>
  </form>
</main>
<footer class="footer">© 2025 Simplify Healthcare</footer>
<script src="../js/main.js"></script>
</body>
</html>
