<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simplify – Conversation</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
<header class="header" role="banner">
  <div class="header-inner container">
    <a class="brand" href="../index.html"><span aria-hidden="true">🩺</span><span>Simplify</span></a>
    <button class="nav-toggle" data-nav-toggle aria-controls="primary-nav" aria-expanded="false">Menu</button>
    <nav class="nav" id="primary-nav" data-nav aria-label="Primary">
      <a href="../index.html">Dashboard</a>
      <a href="../appointments/list.html">Appointments</a>
      <a href="inbox.html">Messages</a>
      <a href="../ai-triage/index.html">AI Triage</a>
      <a href="../email/inbox.html">Email</a>
      <a href="../calendar/month.html">Calendar</a>
      <a href="../new-appointment/index.html">New Appointment</a>
      <a href="../notifications/index.html">Notifications</a>
    </nav>
  </div>
</header>
<main class="main container" role="main">
  <nav aria-label="Breadcrumb" class="helper"><a href="inbox.html">Messages</a> / John Carter</nav>
  <section class="card" aria-label="Conversation thread">
    <div class="card-body" style="display:flex;flex-direction:column;gap:.75rem;max-height:60vh;overflow:auto">
      <div class="alert info" role="article"><strong>John:</strong> Could I get a refill for Lisinopril?</div>
      <div class="alert success" role="article"><strong>Clinic:</strong> Absolutely. We have sent the script to your pharmacy.</div>
      <div class="alert info" role="article"><strong>John:</strong> Thanks!</div>
    </div>
    <div class="card-footer">
      <form class="form-row" aria-label="Reply form">
        <div style="grid-column:1/-1">
          <label for="reply" class="visually-hidden">Reply</label>
          <textarea id="reply" rows="3" placeholder="Type your reply"></textarea>
        </div>
        <div class="form-actions" style="grid-column:1/-1">
          <a class="button secondary" href="inbox.html">Back</a>
          <button class="button" type="submit">Send</button>
        </div>
      </form>
    </div>
  </section>
</main>
<footer class="footer">© 2025 Simplify Healthcare</footer>
<script src="../js/main.js"></script>
</body>
</html>
