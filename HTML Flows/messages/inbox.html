<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simplify – Messages</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
<header class="header" role="banner">
  <div class="header-inner container">
    <a class="brand" href="../index.html"><span aria-hidden="true">🩺</span><span>Simplify</span></a>
    <button class="nav-toggle" data-nav-toggle aria-controls="primary-nav" aria-expanded="false">Menu</button>
    <nav class="nav" id="primary-nav" data-nav aria-label="Primary">
      <a href="../index.html">Dashboard</a>
      <a href="../appointments/list.html">Appointments</a>
      <a href="inbox.html" aria-current="page">Messages</a>
      <a href="../ai-triage/index.html">AI Triage</a>
      <a href="../email/inbox.html">Email</a>
      <a href="../calendar/month.html">Calendar</a>
      <a href="../new-appointment/index.html">New Appointment</a>
      <a href="../notifications/index.html">Notifications</a>
    </nav>
  </div>
</header>
<main class="main container" role="main">
  <section class="grid cols-3">
    <aside class="card" aria-label="Filters">
      <div class="card-header">Search</div>
      <div class="card-body">
        <input id="message-filter" class="input" type="search" placeholder="Search messages" aria-label="Search messages" />
      </div>
    </aside>
    <section class="card" aria-labelledby="threads-h">
      <div class="card-header" id="threads-h">Threads</div>
      <div class="card-body" style="max-height:60vh;overflow:auto">
        <div data-message-item>
          <a href="conversation.html" class="button ghost">John Carter – Prescription refill</a>
        </div>
        <div data-message-item>
          <a href="conversation.html" class="button ghost">Mary Green – Lab results question</a>
        </div>
      </div>
    </section>
    <section class="card" aria-labelledby="preview-h">
      <div class="card-header" id="preview-h">Preview</div>
      <div class="card-body">
        <div class="empty">Select a conversation to preview.</div>
      </div>
    </section>
  </section>
</main>
<footer class="footer">© 2025 Simplify Healthcare</footer>
<script src="../js/main.js"></script>
</body>
</html>
