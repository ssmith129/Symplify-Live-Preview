<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simplify – New Appointment (Step 1)</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
<header class="header" role="banner">
  <div class="header-inner container">
    <a class="brand" href="../index.html"><span aria-hidden="true">🩺</span><span>Simplify</span></a>
    <button class="nav-toggle" data-nav-toggle aria-controls="primary-nav" aria-expanded="false">Menu</button>
    <nav class="nav" id="primary-nav" data-nav aria-label="Primary">
      <a href="../index.html">Dashboard</a>
      <a href="../appointments/list.html">Appointments</a>
      <a href="../messages/inbox.html">Messages</a>
      <a href="../ai-triage/index.html">AI Triage</a>
      <a href="../email/inbox.html">Email</a>
      <a href="../calendar/month.html">Calendar</a>
      <a href="index.html" aria-current="page">New Appointment</a>
      <a href="../notifications/index.html">Notifications</a>
    </nav>
  </div>
</header>
<main class="main container" role="main">
  <h1>Book Appointment – Patient & Visit</h1>
  <form id="appointment-form" class="card" action="step2.html" method="get" novalidate>
    <div class="card-body">
      <div class="error-summary" aria-live="polite"></div>
      <div class="form-row">
        <div>
          <label for="patientName">Patient Name</label>
          <input id="patientName" class="input" type="text" placeholder="Jane Doe" required />
          <div class="error-text" data-error-for="patientName" aria-live="polite"></div>
        </div>
        <div>
          <label for="department">Department</label>
          <select id="department" required>
            <option value="">Select Department</option>
            <option>Cardiology</option>
            <option>Pediatrics</option>
            <option>Orthopedics</option>
          </select>
          <div class="error-text" data-error-for="department" aria-live="polite"></div>
        </div>
        <div>
          <label for="doctor">Doctor</label>
          <select id="doctor" required>
            <option value="">Select Doctor</option>
            <option>Dr. Patel</option>
            <option>Dr. Lee</option>
            <option>Dr. Kim</option>
          </select>
          <div class="error-text" data-error-for="doctor" aria-live="polite"></div>
        </div>
        <div>
          <label for="apptDate">Date</label>
          <input id="apptDate" class="input" type="date" required />
          <div class="error-text" data-error-for="apptDate" aria-live="polite"></div>
        </div>
        <div>
          <label for="apptTime">Time</label>
          <input id="apptTime" class="input" type="time" required />
          <div class="error-text" data-error-for="apptTime" aria-live="polite"></div>
        </div>
        <div>
          <label for="reason">Reason</label>
          <input id="reason" class="input" type="text" placeholder="Consultation" required />
          <div class="error-text" data-error-for="reason" aria-live="polite"></div>
        </div>
      </div>
    </div>
    <div class="card-footer form-actions">
      <a class="button secondary" href="../appointments/list.html">Cancel</a>
      <button class="button" type="submit">Continue</button>
    </div>
  </form>
</main>
<footer class="footer">© 2025 Simplify Healthcare</footer>
<script src="../js/main.js"></script>
</body>
</html>
